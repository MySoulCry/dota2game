<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Иконки для магазина</title>
  <style>
    body { margin: 0; padding: 24px; background: #05060f; color: #e8ecff; font-family: system-ui, sans-serif; }
    h1 { font-size: 20px; }
    p { color: #8b98c4; font-size: 14px; line-height: 1.5; }
    button { margin: 8px 8px 0 0; padding: 12px 18px; border: 0; border-radius: 999px; background: linear-gradient(135deg, #7cf9ff, #8a6bff); color: #06101f; font: inherit; font-weight: 700; }
  </style>
</head>
<body>
  <h1>Иконки PNG для магазина</h1>
  <p>Магазины (Google Play, RuStore) принимают PNG. Нажми кнопку — картинки скачаются в загрузки.</p>
  <button id="p512">Скачать 512×512</button>
  <button id="p192">Скачать 192×192</button>

  <script>
    function svg(size) {
      return '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '" viewBox="0 0 512 512">' +
        '<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1022"/><stop offset="1" stop-color="#05060f"/></linearGradient>' +
        '<linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cf9ff"/><stop offset="1" stop-color="#8a6bff"/></linearGradient></defs>' +
        '<rect width="512" height="512" rx="112" fill="url(#bg)"/>' +
        '<circle cx="256" cy="256" r="150" fill="none" stroke="url(#ac)" stroke-width="10" stroke-dasharray="26 30" opacity="0.75"/>' +
        '<text x="256" y="330" font-family="Arial" font-size="240" font-weight="700" text-anchor="middle" fill="url(#ac)">?</text></svg>';
    }

    function download(size) {
      const img = new Image();
      img.onload = function () {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        canvas.getContext('2d').drawImage(img, 0, 0, size, size);
        const link = document.createElement('a');
        link.href = canvas.toDataURL('image/png');
        link.download = 'icon-' + size + '.png';
        link.click();
      };
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg(size));
    }

    document.getElementById('p512').addEventListener('click', function () { download(512); });
    document.getElementById('p192').addEventListener('click', function () { download(192); });
  </script>
</body>
</html>
